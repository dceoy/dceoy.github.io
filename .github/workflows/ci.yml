---
name: CI/CD
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
jobs:
  typescript-lint-and-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/typescript-package-script.yml@c073f5aac73a01f514f576ad5e7837fdbee7e96e  # v2.3.6
    with:
      package-scripts: lint,format:check
      package-path: .
      audit: true
