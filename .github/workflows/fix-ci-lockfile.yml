name: Refresh audited pnpm lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/oxlint-1.78.0

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: latest
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: ./package.json
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh audited overrides
        run: |
          pnpm audit --fix override || true
          python - <<'PY'
          from pathlib import Path
          path = Path("pnpm-workspace.yaml")
          lines = [line for line in path.read_text().splitlines() if not line.startswith("  fast-uri@")]
          index = lines.index("overrides:") + 1
          lines.insert(index, "  fast-uri: ^4.1.2")
          path.write_text("\n".join(lines) + "\n")
          PY
          pnpm install --no-frozen-lockfile
          pnpm audit
      - name: Commit lockfile updates
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-workspace.yaml pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ci): refresh audited pnpm overrides"
          git push origin "HEAD:${BRANCH}"
